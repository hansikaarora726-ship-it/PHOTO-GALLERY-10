<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f3fa;
            color: #333;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            color: #6c55a3;
            font-size: 36px;
            margin-bottom: 10px;
        }

        header p {
            color: #777;
            font-size: 16px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .photo {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px #00000012;
            transition: transform 0.3s;
        }

        .photo:hover {
            transform: translateY(-6px);
        }

        .photo img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            display: block;
        }

        .photo h3 {
            padding: 15px;
            text-align: center;
            color: #514078;
        }

        footer {
            text-align: center;
            margin-top: 35px;
            color: #777;
        }

        /* Tablet */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }

            header h1 {
                font-size: 28px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            body {
                padding: 18px;
            }

            .gallery {
                grid-template-columns: 1fr;
            }

            .photo img {
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Beautiful moments, captured forever.</p>
    </header>

    <main class="gallery">

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80"
                 alt="Beautiful landscape">
            <h3>Nature</h3>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80"
                 alt="Mountain lake">
            <h3>Mountains</h3>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80"
                 alt="Ocean and beach">
            <h3>Beach</h3>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80"
                 alt="Sunrise landscape">
            <h3>Sunrise</h3>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80"
                 alt="Green forest">
            <h3>Forest</h3>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=800&q=80"
                 alt="Wildlife in nature">
            <h3>Wildlife</h3>
        </div>

    </main>

    <footer>
        <p>© 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
